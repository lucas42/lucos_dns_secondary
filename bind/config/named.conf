options {
	directory "/var/bind";

	// Listen on all interfaces
	listen-on { any; };
	listen-on-v6 { any; };

	// This is a secondary-only server — no zone transfers out
	allow-transfer {
		none;
	};

	pid-file "/var/run/named/named.pid";

	// Secondary only — no recursion
	allow-recursion { none; };
	recursion no;
};

// TSIG key for authenticating zone transfers from the primary
// Generated at startup from TSIG_SECRET env var
include "/etc/bind/tsig.key";

include "/etc/bind/named.conf.local";
